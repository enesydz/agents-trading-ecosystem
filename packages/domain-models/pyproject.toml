[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-models"
version = "0.1.0"
description = "Shared Pydantic domain models for the trading ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_models"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
