[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared-core"
version = "0.1.0"
description = "Shared infrastructure utilities for the trading ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "domain-models",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared_core"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
