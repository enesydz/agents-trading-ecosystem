groups:
  - name: trading-safety
    rules:
      - alert: TradingKillSwitchActive
        expr: trading_kill_switch_active == 1
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Trading kill switch is active"}
      - alert: ExecutionCircuitBreakerOpen
        expr: execution_circuit_breaker_open == 1
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "Execution circuit breaker is open"}
