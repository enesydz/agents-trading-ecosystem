apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agents
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: agents/api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: agents-secrets}}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: agents}
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: agents}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
