[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data"
version = "0.1.0"
description = "Market data ingestion and normalization service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "domain-models",
    "shared-core",
    "websockets>=12.0",
    "aiohttp>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
