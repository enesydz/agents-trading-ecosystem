[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio"
version = "0.1.0"
description = "Portfolio and PnL tracking service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "domain-models",
    "shared-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
