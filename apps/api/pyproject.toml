[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-api"
version = "0.1.0"
description = "API Gateway for the trading ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "domain-models",
    "shared-core",
    "portfolio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
